name: Python CI

on:
  push:
    branches: [main]

  pull_request:

  workflow_dispatch:

env:
  APP_NAME: "Python CI Practice"

jobs:
  test:
    runs-on: ubuntu-latest

    

      - name: Success message
        if: success()
        run: echo "Test completed successfully!"

  check-python:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check Python
        run: python --version

        steps:
      - name: Test
        run: echo "Testing..."

      - name: Check secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi