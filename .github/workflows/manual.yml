name: Python CI

on:
  push:
    branches: [main]

  pull_request:

  workflow_dispatch:

env:
  APP_NAME: "Python CI Practice"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test
        run: echo "Testing..."

      - name: Create report
        run: echo "Test completed successfully" > report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.txt

  check-python:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check Python
        run: python --version