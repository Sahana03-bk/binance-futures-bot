name: Python CI

on:
  push:
    branches: [main]

  pull_request:

  workflow_dispatch:

env:
  APP_NAME: "Python CI Practice"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: echo "Testing..."

      - name: Create report
        run: echo "Test completed successfully" > report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.txt

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Build application
        run: echo "Building application..."

      - name: Create build file
        run: echo "Python application build" > build.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: build.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        run: echo "Deploying application..."

  check-python:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check Python
        run: python --version