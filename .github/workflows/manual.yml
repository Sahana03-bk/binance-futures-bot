name: Python CI

on:
  push:
    branches: [main]

  pull_request:

  workflow_dispatch:

  env:
  APP_NAME: "Python CI Practice"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test
        run: echo "Testing..."

      - name: Success message
        if: success()
        run: echo "Test completed successfully!"

  check-python:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check Python
        run: python --version